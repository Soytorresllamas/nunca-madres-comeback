<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Arial,sans-serif;}
  .og{
    width:1200px;height:630px;background:#eeedfe;position:relative;overflow:hidden;

    font-size:60px;line-height:1.1;font-weight:800;letter-spacing:-0.02em;max-width:760px;
    box-shadow:0 14px 0 rgba(255,46,136,.18);
  }
  .bubble:after{content:"";position:absolute;left:64px;bottom:-22px;border:15px solid transparent;border-top-color:#ff2e88;border-bottom:0;}
  .sub{margin-top:44px;font-size:28px;color:#26215c;font-weight:500;max-width:720px;line-height:1.4;}
  .meta{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);font-size:20px;color:#534ab7;font-weight:600;letter-spacing:.04em;}
</style>
</head>
<body>
  <div class="og">
    <img class="logo" src="http://localhost:5174/logo-nunca-madres-negro.png" alt="Nunca Madres" />
    <span class="ast" style="top:150px;left:120px;font-size:34px;">&#10033;</span>
    <span class="ast" style="top:430px;right:140px;font-size:46px;">&#10033;</span>

    <span class="float" style="top:230px;right:50px;color:rgba(255,46,136,.45);font-size:28px;transform:rotate(6deg);">te vas a arrepentir&hellip;</span>
    <span class="float" style="bottom:150px;left:90px;color:rgba(114,36,62,.42);font-size:24px;transform:rotate(5deg);">&iquest;y qui&eacute;n te cuida?</span>
    <div class="bubble">&iquest;Y los hijos pa' cu&aacute;ndo?</div>
